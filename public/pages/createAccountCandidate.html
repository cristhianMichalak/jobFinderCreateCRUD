<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="../css/createAccountCandidate.css">
</head>
<body>
    <style>
        body {
            font-family: Helvetica, sans-serif;
            height: 100vh;
            width: 100vw;
            padding: 0;
            margin: 0;
        }
    </style>

    <div id="cutScreen">

        <div id="leftSide">
            <div id="logoDiv">
                <img src="../imgs/jobFindLogo.png" alt="siteLogo">
            </div>
        </div>

        <div id="rightSide">
            <div id="formDiv">
                <div id="textDiv">
                    <h1 id="mainText">Create Candidate Account</h1>
                </div>
                <form action="/users_candidates/add" method="post" id="form">

                    <input type="text" name="name" placeholder="Name" class="twoColumns" required>
                    <input type="text" name="surname" placeholder="Surname" class="twoColumns" required>

                    <input type="text" name="email" placeholder="Email" class="twoColumns" required>
                    <input type="password" name="password" placeholder="Password" class="twoColumns" required>

                    <input type="text" name="address" placeholder="Address" class="twoColumns" required>
                    <input type="text" name="city" placeholder="City" class="twoColumns" required>

                    <input type="text" name="state" placeholder="State" class="threeColumns" required>
                    <input type="text" name="country" placeholder="Country" class="threeColumns" required>
                    <input type="text" name="postal_code" placeholder="Postal Code" class="threeColumns" required>

                    <button type="submit" id="submitButton">Sign Up</button>
                </form>
            </div>
        </div>

    </div> 

</body>
</html>
